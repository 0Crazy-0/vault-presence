name: Build Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(jq -r .version manifest.json)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match manifest version $VERSION" >&2
            exit 1
          fi
          echo "PLUGIN_ID=$(jq -r .id manifest.json)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Package
        run: |
          mkdir "$PLUGIN_ID"
          cp main.js manifest.json styles.css README.md LICENSE "$PLUGIN_ID"/
          zip -r "$PLUGIN_ID.zip" "$PLUGIN_ID"

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            ${{ env.PLUGIN_ID }}.zip
            main.js
            manifest.json
            styles.css